[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aia-psf-deconvolution"
version = "0.1.0"
description = "Reproducible AIA PSF Deconvolution Experiments"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Andrew Robbertz", email = "andrew.l.robbertz@nasa.gov" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "astropy",
    "sunpy",
    "aiapy",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

# Optional GPU backend for aia_psf_deconvolution.physics.hofmeister_bid (use_gpu=True).
# The generic "cupy" metapackage builds from source; most users should instead install
# a prebuilt wheel matching their CUDA toolkit, e.g. `pip install cupy-cuda12x`.
gpu = ["cupy"]

[project.urls]
Homepage = "https://github.com/alrobbertz/aia_psf_deconvolution"
Repository = "https://github.com/alrobbertz/aia_psf_deconvolution"
Issues = "https://github.com/alrobbertz/aia_psf_deconvolution/issues"

[project.scripts]
aia-psf-deconvolution = "aia_psf_deconvolution.__main__:main"

[tool.setuptools.packages.find]
include = ["aia_psf_deconvolution*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F"]
ignore = ["F403"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"